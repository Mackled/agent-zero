<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agent Zero</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
   <style>
       /*
        * FUTURISTIC LOGIN PAGE - ALIGNED WITH INDEX.HTML by Kilo Code
        *
        * TASARIM NOTLARI:
        * 1. Estetik Tutarlılık: index.html'deki fütüristik ve neon estetiği tam olarak yansıtıldı.
        * 2. CSS Değişkenleri: Renk, font, boşluk ve efektler için index.html'deki :root değişkenleri kopyalandı.
        * 3. Glassmorphism Etkisi: Yarı saydam, bulanık arka planlı "cam" kart tasarımı uygulandı.
        * 4. Neon Vurgular: Odaklanma (focus) ve hover durumlarında parlak neon efektleri eklendi.
        * 5. Modern Tipografi: Fütüristik bir his için 'Orbitron' ve 'Roboto Mono' fontları kullanıldı.
        * 6. Akıcı Animasyonlar: Sayfa yüklenirken ve etkileşimlerde yumuşak geçişler ve animasyonlar eklendi.
       */

       /* 1. KÖK DEĞİŞKENLER VE FONT (index.html'den senkronize edildi) */
       @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

       :root {
           /* Fütüristik Renk Paleti (Koyu Mod) */
           --c-bg: #0a0a14;
           --c-surface: rgba(15, 20, 40, 0.75);
           --c-surface-2: rgba(30, 40, 70, 0.7);
           --c-border: rgba(78, 140, 255, 0.3);
           --c-text-primary: #e0e0e0;
           --c-text-secondary: #a0a0ff;
           --c-primary: #4e8cff; /* Elektrik Mavisi */
           --c-primary-glow: rgba(78, 140, 255, 0.25);
           --c-primary-hover: #6fa1ff;
           --c-accent: #ff47a7; /* Neon Pembe */
           --c-error: #ff4c3c;
           --c-input-bg: rgba(20, 25, 50, 0.7);

           /* Tipografi */
           --font-main: "Orbitron", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           --font-mono: "Roboto Mono", monospace;
           --fs-sm: 0.8rem;
           --fs-base: 0.9rem;
           --fs-md: 1rem;
           --fs-lg: 1.1rem;

           /* Boşluklar */
           --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem;

           /* Diğer */
           --border-radius: 10px;
           --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
       }

       /* 2. TEMEL STİLLER */
       *, *::before, *::after {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
       }

       body {
           font-family: var(--font-main);
           background-color: var(--c-bg);
           color: var(--c-text-primary);
           display: flex;
           align-items: center;
           justify-content: center;
           min-height: 100vh;
           padding: var(--space-4);
           background-image:
               radial-gradient(circle at 10% 10%, rgba(78, 140, 255, 0.1) 0%, transparent 30%),
               radial-gradient(circle at 90% 80%, rgba(255, 71, 167, 0.1) 0%, transparent 40%);
           -webkit-font-smoothing: antialiased;
           -moz-osx-font-smoothing: grayscale;
       }

       /* 3. GİRİŞ KARTI (LOGIN CARD) YAPISI */
       .login-card {
           background: var(--c-surface);
           border: 1px solid var(--c-border);
           backdrop-filter: blur(12px);
           -webkit-backdrop-filter: blur(12px);
           border-radius: var(--border-radius);
           padding: var(--space-6);
           width: 100%;
           max-width: 420px;
           box-shadow: 0 0 25px var(--c-primary-glow);
           animation: fadeIn 0.7s var(--transition);
           text-align: center;
       }

       .login-card__header {
           margin-bottom: var(--space-5);
       }

       .login-card__logo {
           width: 70px;
           height: 70px;
           margin-bottom: var(--space-4);
           border-radius: 50%;
           border: 2px solid var(--c-border);
           box-shadow: 0 0 10px rgba(255,255,255,0.1);
       }

       .login-card__title {
           font-family: var(--font-main);
           font-size: 2rem;
           font-weight: 700;
           color: var(--c-primary);
           text-shadow: 0 0 5px var(--c-primary-glow);
       }

       /* 4. FORM ELEMANLARI */
       .login-form {
           display: flex;
           flex-direction: column;
           gap: var(--space-4);
       }

       .form-group {
           text-align: left;
       }

       .form-label {
           display: block;
           margin-bottom: var(--space-2);
           font-family: var(--font-mono);
           font-size: var(--fs-sm);
           color: var(--c-text-secondary);
       }

       .form-input {
           width: 100%;
           background-color: var(--c-input-bg);
           border: 1px solid var(--c-border);
           border-radius: var(--border-radius);
           padding: var(--space-3);
           color: var(--c-text-primary);
           font-family: var(--font-mono);
           font-size: var(--fs-base);
           transition: var(--transition);
       }

       .form-input:focus {
           outline: none;
           border-color: var(--c-primary);
           box-shadow: 0 0 10px var(--c-primary-glow);
       }

       .submit-button {
           width: 100%;
           padding: var(--space-3);
           margin-top: var(--space-3);
           background-color: var(--c-primary);
           color: white;
           border: 1px solid var(--c-primary);
           border-radius: var(--border-radius);
           font-family: var(--font-main);
           font-size: var(--fs-md);
           font-weight: 700;
           cursor: pointer;
           transition: var(--transition);
           text-transform: uppercase;
           letter-spacing: 1px;
       }

       .submit-button:hover {
           background-color: var(--c-primary-hover);
           box-shadow: 0 0 20px var(--c-primary-glow);
           transform: translateY(-2px);
       }

       .error-message {
           color: var(--c-error);
           text-align: center;
           margin-top: var(--space-4);
           font-size: var(--fs-sm);
           font-family: var(--font-mono);
           min-height: 1.2em; /* Prevent layout shift */
       }

       /* 5. ANİMASYON */
       @keyframes fadeIn {
           from { opacity: 0; transform: scale(0.95) translateY(-10px); }
           to { opacity: 1; transform: scale(1) translateY(0); }
       }
   </style>
</head>
<body>
    <main>
        <section class="login-card">
            <header class="login-card__header">
                <img src="public/darkSymbol.svg" alt="Agent Zero Logo" class="login-card__logo">
                <h1 class="login-card__title">Agent Zero</h1>
            </header>
            
            <form class="login-form" method="POST" action="/login">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
                
                <button type="submit" class="submit-button">Login</button>
                
                <div class="error-message">
                    {% if error %}
                        <p>{{ error }}</p>
                    {% endif %}
                </div>
            </form>
        </section>
    </main>
</body>
</html>
