<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="symbol-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b100ff;stop-opacity:1" />
    </linearGradient>
    <filter id="symbol-glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="14" fill="rgba(10, 10, 20, 0.7)" stroke="url(#symbol-gradient)" stroke-width="1" filter="url(#symbol-glow)"/>
  
  <!-- Simplified AYLA Letters -->
  <g filter="url(#symbol-glow)">
    <!-- A -->
    <path d="M9 23 L11 13 L13 13 L15 23" stroke="url(#symbol-gradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M10 20 L14 20" stroke="url(#symbol-gradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Y -->
    <path d="M17 13 L19 18 L19 23" stroke="url(#symbol-gradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M20 13 L18 18" stroke="url(#symbol-gradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>