<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Agent Zero - Futura</title>
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
    <link rel="manifest" href="js/manifest.json">

    <!-- Vendor Scripts & Styles -->
    <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css">
    <script src="vendor/flatpickr/flatpickr.min.js"></script>
    <script src="vendor/ace-min/ace.js"></script>
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <script defer src="vendor/katex/katex.min.js"></script>
    <script defer src="vendor/katex/katex.auto-render.min.js"></script>
    <script src="vendor/qrcode.min.js"></script>
    <link rel="stylesheet" href="vendor/google/google-icons.css" />

    <!-- Critical Pre-load Scripts from webuiold -->
    <script>
        globalThis.safeCall = function (name, ...args) {
            if (window[name]) window[name](...args)
        }
    </script>
    <script>
        // Pre-define schedulerSettings skeleton to ensure it's available to Alpine
        globalThis.schedulerSettings = function () {
            return {
                tasks: [], isLoading: true, selectedTask: null, expandedTaskId: null, sortField: 'name',
                sortDirection: 'asc', filterType: 'all', filterState: 'all', pollingInterval: null,
                pollingActive: false, editingTask: { name: '', type: 'scheduled', state: 'idle',
                    schedule: { minute: '*', hour: '*', day: '*', month: '*', weekday: '*', timezone: '' },
                    token: '', plan: { todo: [], in_progress: null, done: [] }, system_prompt: '',
                    prompt: '', attachments: [] }, isCreating: false, isEditing: false,
                showLoadingState: false, viewMode: 'list', selectedTaskForDetail: null,
                attachmentsText: '', filteredTasks: [],
                init() {
                    console.log('Basic schedulerSettings initialized');
                    this.$watch('editingTask.type', (newType) => {
                        if (newType === 'planned') {
                            this.$nextTick(() => {
                                if (this.initFlatpickr) {
                                    if (this.isCreating) this.initFlatpickr('create');
                                    else if (this.isEditing) this.initFlatpickr('edit');
                                }
                            });
                        }
                    });
                }
            };
        };
    </script>

    <style>
        /* Futuristic Frontend Refactor by Kilo Code */

        /* 1. KÖK DEĞİŞKENLER VE TEMEL STİLLER */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            /* Fütüristik Renk Paleti (Koyu Mod) */
            --c-bg: #0a0a14;
            --c-surface: rgba(15, 20, 40, 0.75);
            --c-surface-2: rgba(30, 40, 70, 0.7);
            --c-border: rgba(78, 140, 255, 0.3);
            --c-text-primary: #e0e0e0;
            --c-text-secondary: #a0a0ff;
            --c-primary: #4e8cff; /* Elektrik Mavisi */
            --c-primary-glow: rgba(78, 140, 255, 0.25);
            --c-primary-hover: #6fa1ff;
            --c-accent: #ff47a7; /* Neon Pembe */
            --c-accent-hover: #ff6bb7;
            --c-success: #2eff71;
            --c-error: #ff4c3c;
            --c-user-msg-bg: rgba(44, 62, 80, 0.8);
            --c-ai-msg-bg: rgba(30, 40, 70, 0.8);
            --c-input-bg: rgba(20, 25, 50, 0.7);
            --c-scrollbar-thumb: var(--c-primary);
            --c-scrollbar-track: #222;

            /* Tipografi */
            --font-main: "Orbitron", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Roboto Mono", monospace;
            --fs-xs: 0.7rem; --fs-sm: 0.8rem; --fs-base: 0.9rem; --fs-md: 1rem; --fs-lg: 1.1rem;

            /* Boşluklar */
            --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem;

            /* Diğer */
            --border-radius: 10px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Light mode is not the focus, but let's keep it functional */
        .light-mode {
             --c-bg: #f0f2f5; --c-surface: rgba(255, 255, 255, 0.8); --c-surface-2: #e9ecef;
             --c-border: #dee2e6; --c-text-primary: #212529; --c-text-secondary: #6c757d;
             --c-primary: #007bff; --c-primary-hover: #0056b3; --c-accent: #dc3545;
             --c-user-msg-bg: #e9f5ff; --c-ai-msg-bg: #f8f9fa; --c-input-bg: #ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }

        body {
            background-color: var(--c-bg);
            color: var(--c-text-primary);
            font-family: var(--font-main);
            font-size: var(--fs-base);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(78, 140, 255, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(255, 71, 167, 0.1) 0%, transparent 40%);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-scrollbar-thumb); border-radius: 4px; border: 1px solid var(--c-bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-primary-hover); }

        /* 2. ANA YAPI (LAYOUT) */
        .container { display: flex; height: 100vh; }

        #left-panel {
            width: 280px;
            background: var(--c-surface);
            border-right: 1px solid var(--c-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            transition: margin-left var(--transition);
            z-index: 1001;
            box-shadow: 0 0 15px rgba(78, 140, 255, 0.15);
        }

        #right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            #left-panel { position: fixed; left: 0; top: 0; bottom: 0; margin-left: -280px; }
            #left-panel.open { margin-left: 0; }
            .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; }
            .sidebar-overlay.hidden { display: none; }
        }

        /* 3. KENAR ÇUBUĞU (SIDEBAR) BİLEŞENLERİ */
        .icons-section { padding: var(--space-3); border-bottom: 1px solid var(--c-border); display: flex; align-items: center; gap: var(--space-3); }
        .toggle-sidebar-button, #logo-container a { display: flex; align-items: center; justify-content: center; color: var(--c-text-secondary); background: none; border: none; cursor: pointer; transition: var(--transition); }
        .toggle-sidebar-button:hover, #logo-container a:hover { color: var(--c-primary-hover); transform: scale(1.1); }
        #logo-container img { border-radius: 50%; border: 1px solid var(--c-border); }

        .left-panel-top { flex: 1; overflow-y: auto; padding: var(--space-4); }
        .config-button {
            width: 100%; padding: var(--space-3); margin-bottom: var(--space-2);
            background-color: var(--c-surface-2); border: 1px solid var(--c-border);
            color: var(--c-text-primary); border-radius: var(--border-radius);
            text-align: left; cursor: pointer; transition: var(--transition);
            font-family: var(--font-main); font-size: var(--fs-sm);
            display: flex; align-items: center; gap: var(--space-3);
        }
        .config-button:hover { background-color: var(--c-primary); color: white; border-color: var(--c-primary-hover); box-shadow: 0 0 15px var(--c-primary-glow); }
        .config-button svg, .config-button .material-symbols-outlined { width: 20px; height: 20px; }

        .tabs-container { border-bottom: 1px solid var(--c-border); margin-bottom: var(--space-4); }
        .tabs { display: flex; }
        .tab { padding: var(--space-3) var(--space-4); cursor: pointer; color: var(--c-text-secondary); position: relative; }
        .tab.active { color: var(--c-primary); font-weight: bold; }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background-color: var(--c-primary); box-shadow: 0 0 8px var(--c-primary-glow); }

        .chats-list-container, .tasks-list-container { max-height: 200px; overflow-y: auto; }
        .config-list li { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-1); }
        .chat-list-button { flex-grow: 1; padding: var(--space-2); border-radius: 6px; cursor: pointer; transition: var(--transition); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-list-button:hover, .chat-list-button.font-bold { background-color: var(--c-surface-2); color: var(--c-primary-hover); }
        .edit-button { background: none; border: none; color: var(--c-text-secondary); cursor: pointer; padding: var(--space-2); }
        .edit-button:hover { color: var(--c-accent); }

        .left-panel-bottom { padding: var(--space-4); border-top: 1px solid var(--c-border); }
        .pref-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-base); text-transform: uppercase; }
        .arrow-icon { transition: transform var(--transition); }
        .arrow-icon.rotated { transform: rotate(90deg); }
        .pref-section ul li { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) 0; font-size: var(--fs-sm); }

        /* Switch styles */
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--c-surface-2); transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--c-primary); }
        input:checked + .slider:before { transform: translateX(14px); }

        /* 4. ANA İÇERİK (MAIN CONTENT) */
        #time-date-container { display: flex; justify-content: flex-end; align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--c-border); gap: var(--space-4); background: var(--c-surface); backdrop-filter: blur(10px); }
        #chat-history { flex: 1; overflow-y: auto; padding: var(--space-4); }

        /* 5. MESAJ BALONCUKLARI */
        .message-wrapper { margin-bottom: var(--space-5); animation: fadeIn 0.5s var(--transition); }
        .message-content { display: inline-block; max-width: 80%; }
        .message-box { padding: var(--space-3) var(--space-4); border-radius: var(--border-radius); word-break: break-word; position: relative; border: 1px solid transparent; }
        .user .message-box { background-color: var(--c-user-msg-bg); border-color: var(--c-border); border-bottom-right-radius: 4px; }
        .assistant .message-box { background-color: var(--c-ai-msg-bg); border-color: var(--c-border); border-bottom-left-radius: 4px; }
        .user { text-align: right; }

        /* 6. CHAT GİRİŞ ALANI (INPUT AREA) */
        #input-section { padding: var(--space-3); border-top: 1px solid var(--c-border); background: var(--c-surface); backdrop-filter: blur(12px); }
        .input-row { display: flex; align-items: center; gap: var(--space-3); }
        #chat-input-container { flex: 1; position: relative; }
        #chat-input {
            width: 100%; background-color: var(--c-input-bg); border: 1px solid var(--c-border);
            border-radius: var(--border-radius); color: var(--c-text-primary); font-family: var(--font-mono);
            font-size: var(--fs-sm); padding: var(--space-3); resize: none; min-height: 48px; max-height: 200px;
            transition: var(--transition); padding-right: 40px;
        }
        #chat-input:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 10px var(--c-primary-glow); }

        .chat-button, .attachment-icon {
            background: var(--c-surface-2); border: 1px solid var(--c-border); color: var(--c-text-secondary);
            cursor: pointer; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .chat-button:hover, .attachment-icon:hover { background-color: var(--c-primary); color: white; box-shadow: 0 0 15px var(--c-primary-glow); }
        #send-button { background-color: var(--c-primary); color: white; }
        #send-button:hover { background-color: var(--c-primary-hover); }

        .text-buttons-row { display: flex; justify-content: center; gap: var(--space-3); margin-top: var(--space-3); }
        .text-button {
            background: none; border: 1px solid var(--c-border); color: var(--c-text-secondary);
            padding: var(--space-2) var(--space-3); border-radius: var(--border-radius); cursor: pointer;
            display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-sm);
            transition: var(--transition);
        }
        .text-button:hover { background-color: var(--c-surface-2); color: var(--c-text-primary); border-color: var(--c-primary); }
        .text-button svg, .text-button .material-symbols-outlined { width: 14px; height: 14px; }

        /* 7. YARDIMCI STİLLER VE ANİMASYONLAR */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        [x-cloak] { display: none !important; }

        #progress-bar-box { background-color: var(--c-surface-2); padding: var(--space-1) var(--space-4); font-size: var(--fs-sm); }
        .tooltip { position: absolute; background-color: #333; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 12px; white-space: nowrap; z-index: 10; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 5px; }
        #expand-button { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--c-text-secondary); cursor: pointer; }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(5px); }
        .modal-container { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--border-radius); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 1100px; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-header { padding: var(--space-4); border-bottom: 1px solid var(--c-border); display: flex; justify-content: space-between; align-items: center; }
        .modal-content { padding: var(--space-4); overflow-y: auto; flex-grow: 1; }
        .modal-footer { padding: var(--space-4); border-top: 1px solid var(--c-border); text-align: right; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--c-text-secondary); cursor: pointer; }
        .full-screen-input-modal { width: 90vw; height: 80vh; }
        #full-screen-input { width: 100%; height: calc(100% - 40px); background-color: var(--c-input-bg); border: none; color: var(--c-text-primary); }
        .editor-toolbar { display: flex; gap: 1rem; padding: 0.5rem; background-color: var(--c-surface-2); border-bottom: 1px solid var(--c-border); }
        .toolbar-group { display: flex; gap: 0.5rem; }
        .toolbar-button { background: none; border: 1px solid transparent; color: var(--c-text-secondary); padding: 0.5rem; border-radius: 4px; }
        .toolbar-button:hover:not(:disabled) { background-color: var(--c-primary); color: white; }
        .toolbar-button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- OLD STYLES FOR FUNCTIONALITY --- */
        .message-default, .message-agent, .message-agent-response, .message-agent-delegation, .message-tool, .message-code-exe, .message-browser, .message-info, .message-util, .message-warning, .message-error { color: #e0e0e0; }
        .message-default { background-color: #1a242f; }
        .message-agent { background-color: #34506b; }
        .message-agent-response { min-width: 255px; background-color: #1f3c1e; }
        .message-agent-delegation { background-color: #12685e; }
        .message-tool { background-color: #2a4170; }
        .message-code-exe { background-color: #4b3a69; }
        .message-browser { background-color: #4b3a69; }
        .message-info { background-color: var(--c-surface); }
        .message-util { background-color: #23211a; display: none; }
        .message-warning { background-color: #bc8036; }
        .message-error { background-color: #af2222; }
        .msg-kvps { font-size: 0.9em; margin: 0.5rem 0 0.55rem 0; border-collapse: collapse; width: 100%; }
        .kvps-val pre { white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: 0.75rem; }
        .msg-kvps th, .msg-kvps td { padding: 0.25rem; padding-left: 0; text-align: left; }
        .msg-kvps th { color: var(--c-primary); width: 40%; }
        .msg-kvps tr { border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        .msg-heading { margin: 0; position: relative; display: block; white-space: nowrap; }
        .msg-heading h4 { margin: 0; margin-right: 4em; overflow: hidden; text-overflow: ellipsis; }
        .msg-json { display: none; }
        .msg-thoughts { display: auto; }
        .mic-inactive{ background-color: grey; }
        .mic-activating{ background-color: silver; animation: pulse 0.8s infinite; }
        .mic-listening { background-color: red; }
        .mic-recording { background-color: green; }
        .mic-waiting { background-color: teal; }
        .mic-processing { background-color: darkcyan; animation: pulse 0.8s infinite; transform-origin: center; }
        .action-buttons { position: absolute; height:0; width:fit-content; overflow: visible; top: 0.3em; right: 0.1em; display: none; flex-direction: row; gap: 0; border-radius: 6px; transition: opacity 0.3s ease-in-out; z-index: 10; }
        .action-buttons .action-button { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; cursor: pointer; background-color: var(--c-bg); color: var(--c-text-primary); padding: 0; font-size: 14px; margin: 0; }
        .message-body:hover > .action-buttons, .msg-content:hover .action-buttons { display: flex; }
        .scheduler-status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; text-transform: capitalize; white-space: nowrap; }
        .scheduler-status-idle { background-color: rgba(0, 100, 0, 0.2); color: #2a9d8f; border: 1px solid rgba(42, 157, 143, 0.3); }
        .scheduler-status-running { background-color: rgba(0, 60, 120, 0.2); color: #4361ee; border: 1px solid rgba(67, 97, 238, 0.3); }
        .scheduler-status-disabled { background-color: rgba(70, 70, 70, 0.2); color: #6c757d; border: 1px solid rgba(108, 117, 125, 0.3); }
        .scheduler-status-error { background-color: rgba(120, 0, 0, 0.2); color: #e63946; border: 1px solid rgba(230, 57, 70, 0.3); }
        .scheduler-status-badge-small { font-size: 10px; padding: 2px 6px; margin-right: 5px; min-width: 40px; text-align: center; }
        .task-container-vertical { display: flex; flex-direction: column; width: 100%; gap: 6px; }
        .task-info-line { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 2px; }
    </style>
</head>
<body class="dark-mode device-pointer">

    <div class="container">
        <div id="sidebar-overlay" class="sidebar-overlay hidden" @click="document.getElementById('left-panel').classList.remove('open'); document.getElementById('sidebar-overlay').classList.add('hidden');"></div>
        
        <div id="left-panel" class="panel">
            <div class="icons-section">
                <button id="toggle-sidebar" class="toggle-sidebar-button" aria-label="Toggle Sidebar" @click="document.getElementById('left-panel').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('hidden');">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <a id="logo-container" href="https://github.com/agent0ai/agent-zero" target="_blank" rel="noopener noreferrer">
                    <img src="./public/splash.jpg" alt="a0" width="22" height="22">
                </a>
            </div>

            <div class="left-panel-top">
                <div class="config-section">
                    <button class="config-button" @click="resetChat()"><span class="material-symbols-outlined">restart_alt</span>Reset Chat</button>
                    <button class="config-button" @click="newChat()"><span class="material-symbols-outlined">add_comment</span>New Chat</button>
                    <button class="config-button" @click="loadChats()"><span class="material-symbols-outlined">folder_open</span>Load Chat</button>
                    <button class="config-button" @click="saveChat()"><span class="material-symbols-outlined">save</span>Save Chat</button>
                    <button class="config-button" @click="restart()"><span class="material-symbols-outlined">power_settings_new</span>Restart</button>
                    <button class="config-button" @click="settingsModalProxy.openModal()"><span class="material-symbols-outlined">settings</span>Settings</button>
                    <button class="config-button" @click="openModal('settings/memory/memory-dashboard.html');"><span class="material-symbols-outlined">memory</span>Memory</button>
                </div>
                <div class="tabs-container">
                    <div class="tabs">
                        <div class="tab active" id="chats-tab">Chats</div>
                        <div class="tab" id="tasks-tab">Tasks</div>
                    </div>
                </div>
                <div class="config-section" id="chats-section" x-data="{ contexts: [], selected: '' }">
                    <div class="chats-list-container">
                        <ul class="config-list">
                            <template x-for="context in contexts">
                                <li>
                                    <div :class="{'chat-list-button': true, 'font-bold': context.id === selected}" @click="selected = context.id; selectChat(context.id)">
                                        <span class="chat-name" :title="context.name ? context.name : 'Chat #' + context.no" x-text="context.name ? context.name : 'Chat #' + context.no"></span>
                                    </div>
                                    <button class="edit-button" @click="killChat(context.id)">X</button>
                                </li>
                            </template>
                        </ul>
                        <div class="empty-list-message" x-show="contexts.length === 0"><p><i>No chats to list.</i></p></div>
                    </div>
                </div>
                <div class="config-section" id="tasks-section" x-data="{ tasks: [], selected: '', openTaskDetail(taskId) { globalThis.openTaskDetail(taskId); } }" style="display: none;">
                    <div class="tasks-list-container">
                        <ul class="config-list">
                            <template x-for="task in tasks">
                                <li>
                                    <div :class="{'chat-list-button': true, 'font-bold': task.id === selected, 'has-task-container': true}" @click="selected = task.id; selectChat(task.id)">
                                        <div class="task-container-vertical">
                                            <span class="task-name" :title="(task.task_name || `Task #${task.no}`) + ' (' + (task.name || `Chat #${task.no}`) + ')'" x-text="(task.task_name || `Task #${task.no}`) + ' (' + (task.name || `Chat #${task.no}`) + ')'" :data-task-id="task.id"></span>
                                            <div class="task-info-line">
                                                <span class="scheduler-status-badge scheduler-status-badge-small" :class="task.state ? `scheduler-status-${task.state}` : 'scheduler-status-idle'" x-text="task.state || 'idle'"></span>
                                                <button class="edit-button" @click.stop="openTaskDetail(task.id)" title="View task details" style="margin-left: auto; margin-right: 5px;">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 512 512" fill="currentColor">
                                                        <path d="M256 0c70.69 0 134.69 28.66 181.02 74.98C483.34 121.3 512 185.31 512 256c0 70.69-28.66 134.7-74.98 181.02C390.69 483.34 326.69 512 256 512c-70.69 0-134.69-28.66-181.02-74.98C28.66 390.69 0 326.69 0 256c0-70.69 28.66-134.69 74.98-181.02C121.31 28.66 185.31 0 256 0zm-9.96 161.03c0-4.28.76-8.26 2.27-11.91 1.5-3.63 3.77-6.94 6.79-9.91 3-2.95 6.29-5.2 9.84-6.7 3.57-1.5 7.41-2.28 11.52-2.28 4.12 0 7.96.78 11.49 2.27 3.54 1.51 6.78 3.76 9.75 6.73 2.95 2.97 5.16 6.26 6.64 9.91 1.49 3.63 2.22 7.61 2.22 11.89 0 4.17-.73 8.08-2.21 11.69-1.48 3.6-3.68 6.94-6.65 9.97-2.94 3.03-6.18 5.32-9.72 6.84-3.54 1.51-7.38 2.29-11.52 2.29-4.22 0-8.14-.76-11.75-2.26-3.58-1.51-6.86-3.79-9.83-6.79-2.94-3.02-5.16-6.34-6.63-9.97-1.48-3.62-2.21-7.54-2.21-11.77zm13.4 178.16c-1.11 3.97-3.35 11.76 3.3 11.76 1.44 0 3.27-.81 5.46-2.4 2.37-1.71 5.09-4.31 8.13-7.75 3.09-3.5 6.32-7.65 9.67-12.42 3.33-4.76 6.84-10.22 10.49-16.31.37-.65 1.23-.87 1.89-.48l12.36 9.18c.6.43.73 1.25.35 1.86-5.69 9.88-11.44 18.51-17.26 25.88-5.85 7.41-11.79 13.57-17.8 18.43l-.1.06c-6.02 4.88-12.19 8.55-18.51 11.01-17.58 6.81-45.36 5.7-53.32-14.83-5.02-12.96-.9-27.69 3.06-40.37l19.96-60.44c1.28-4.58 2.89-9.62 3.47-14.33.97-7.87-2.49-12.96-11.06-12.96h-17.45c-.76 0-1.38-.62-1.38-1.38l.08-.48 4.58-16.68c.16-.62.73-1.04 1.35-1.02l89.12-2.79c.76-.03 1.41.57 1.44 1.33l-.07.43-37.76 124.7zm158.3-244.93c-41.39-41.39-98.58-67-161.74-67-63.16 0-120.35 25.61-161.74 67-41.39 41.39-67 98.58-67 161.74 0 63.16 25.61 120.35 67 161.74 41.39 41.39 98.58 67 161.74 67 63.16 0 120.35-25.61 161.74-67 41.39-41.39 67-98.58 67-161.74 0-63.16-25.61-120.35-67-161.74z" />
                                                    </svg>
                                                </button>
                                                <button class="edit-button" @click.stop="resetChat(task.id)" style="margin-right: 5px;" title="Clear task chat">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 122.88 121.1" fill="currentColor">
                                                        <path d="M62.89,56.03c1.11-0.35,2.34-0.25,3.72,0.37l10.4,7.87c2.26,1.71,4.24,3.78,2.73,6.9 c-0.51,1.06-1.4,2.1-2.38,3.49l-0.53,0.75c-1.97,2.8-2.61,2-5.71,1.83c0.56,13.37,1.75,27.82-2.64,40.88 c-0.87,2.7-3.32,3.44-6.95,2.71l-6.1-2.03c4.11-6.14,6.16-13.85,6.44-22.89c-3.46,8.58-6.8,16.96-10.68,20.86l-6.28-2.08 c0.61-3.05,1.05-5.43,0.35-6.9l-4.07,4.24l-9.33-5.77c6.36-3.36,11.62-7.87,15.6-13.73c-6.69,5.01-12.76,8.1-18.14,8.99 c-2.75,0.83-4.49,0.35-5.16-1.53c-0.48-1.34-0.05-1.77,0.81-2.86c1.11-1.41,2.61-2.67,4.35-3.79c-3.13,1.1-4.64,0.95-6.37,1.51 c-4.9,1.59-9.94-1.86-8.26-6.9c1.07-3.23,3.54-3.09,6.67-4.07l5.42-1.69c-5.19,0.28-10.32,0.45-15.02-0.25 c-5.4-0.8-5.31-0.99-8.24-5.38c-3.94-5.91-6.25-11.45,2.52-9.16c16.73,3.18,33.56,5.34,51.25-0.98c-0.76-1.32-0.9-2.57-0.5-3.73 C57.37,60.94,61.13,56.58,62.89,56.03L62.89,56.03z M113.8,2.42L74.45,51.53c-4.71,6.68,3.2,11.91,8.39,5.64l39.2-49.27 C125.12,1.86,119.13-3.16,113.8,2.42L113.8,2.42z" />
                                                    </svg>
                                                </button>
                                                <button title="Delete task" class="edit-button" @click.stop="deleteTaskGlobal(task.id)">X</button>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                        <div class="empty-list-message" x-show="tasks.length === 0"><p><i>No tasks to list.</i></p></div>
                    </div>
                </div>
            </div>
            <div class="left-panel-bottom">
                <div class="pref-section" x-data="{ prefOpen: true }">
                    <span>
                        <h3 class="pref-header" @click="prefOpen = !prefOpen">
                            Preferences
                            <svg class="arrow-icon" :class="{'rotated': prefOpen}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <path d="M6 9l6 6 6-6" />
                            </svg>
                        </h3>
                        <ul class="config-list" id="pref-list" x-show="prefOpen" x-collapse>
                            <li x-data="{ autoScroll: true }">
                                <span>Autoscroll</span>
                                <label class="switch">
                                    <input id="auto-scroll-switch" type="checkbox" x-model="autoScroll" x-effect="globalThis.safeCall('toggleAutoScroll',autoScroll)" checked>
                                    <span class="slider"></span>
                                </label>
                            </li>
                            <li x-data="{ darkMode: localStorage.getItem('darkMode') != 'false' }" x-init="$watch('darkMode', val => toggleDarkMode(val))">
                                <span class="switch-label">Dark mode</span>
                                <label class="switch">
                                    <input type="checkbox" x-model="darkMode" checked>
                                    <span class="slider"></span>
                                </label>
                            </li>
                            <li x-data="{ speech: localStorage.getItem('speech') == 'true' }" x-init="$watch('speech', val => toggleSpeech(val))">
                                <span class="switch-label">Speech</span>
                                <label class="switch">
                                    <input type="checkbox" x-model="speech">
                                    <span class="slider"></span>
                                </label>
                            </li>
                            <li x-data="{ showThoughts: true }">
                                <span>Show thoughts</span>
                                <label class="switch">
                                    <input type="checkbox" x-model="showThoughts" x-effect="globalThis.safeCall('toggleThoughts',showThoughts)" checked>
                                    <span class="slider"></span>
                                </label>
                            </li>
                            <li x-data="{ showJson: false }">
                                <span>Show JSON</span>
                                <label class="switch">
                                    <input type="checkbox" x-model="showJson" x-effect="globalThis.safeCall('toggleJson',showJson)">
                                    <span class="slider"></span>
                                </label>
                            </li>
                            <li x-data="{ showUtils: false }">
                                <span>Show utility messages</span>
                                <label class="switch">
                                    <input type="checkbox" x-model="showUtils" x-effect="globalThis.safeCall('toggleUtils',showUtils)">
                                    <span class="slider"></span>
                                </label>
                            </li>
                        </ul>
                    </span>
                </div>
                <div class="version-info">
                    <span id="a0version">Version {{version_no}} {{version_time}}</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="right-panel" class="panel">
            <div id="time-date-container">
                <div id="time-date"></div>
                <div class="status-icon" x-data="{ connected: true }">
                    <svg viewBox="0 0 30 30">
                        <circle cx="15" cy="15" r="8" :fill="connected ? 'var(--c-success)' : 'var(--c-error)'" />
                    </svg>
                </div>
                <x-component path="notifications/notification-icons.html"></x-component>
            </div>
            <div id="chat-history"></div>
            <div style="position: relative; height: 0;">
                <x-component path="notifications/notification-toast-stack.html"></x-component>
            </div>
            <div id="toast" class="toast"></div>
            <div id="progress-bar-box">
                <h4 id="progress-bar-h"><span id="progress-bar-i">|></span><span id="progress-bar"></span></h4>
                <h4 id="progress-bar-stop-speech" x-data x-cloak x-show="$store.speech.isSpeaking">
                    <span id="stop-speech" @click="$store.speech.stop()" style="cursor: pointer">Stop Speech</span>
                </h4>
            </div>
            <div id="input-section" x-data="{ paused: false }">
                <div>
                    <x-component path="chat/attachments/inputPreview.html" />
                </div>
                <div class="input-row">
                    <div class="attachment-wrapper" x-data="{ showTooltip: false }">
                        <label for="file-input" class="attachment-icon" @mouseover="showTooltip = true" @mouseleave="showTooltip = false">
                            <span class="material-symbols-outlined">attachment</span>
                        </label>
                        <input type="file" id="file-input" accept="*" multiple style="display: none" @change="$store.chatAttachments.handleFileUpload($event)">
                        <div x-show="showTooltip" class="tooltip">Add attachments</div>
                    </div>
                    <div id="chat-input-container">
                        <textarea id="chat-input" placeholder="Type your message here..." rows="1"></textarea>
                        <button id="expand-button" @click="$store.fullScreenInputModal.openModal()" aria-label="Expand input">
                            <span class="material-symbols-outlined">fullscreen</span>
                        </button>
                    </div>
                    <div id="chat-buttons-wrapper">
                        <button class="chat-button" id="send-button" aria-label="Send message">
                            <span class="material-symbols-outlined">send</span>
                        </button>
                        <button class="chat-button mic-inactive" id="microphone-button" aria-label="Start/Stop recording" @click="$store.speech.handleMicrophoneClick()" x-effect="$store.speech.updateMicrophoneButtonUI()">
                            <span class="material-symbols-outlined">mic</span>
                        </button>
                    </div>
                </div>
                <div class="text-buttons-row">
                    <button class="text-button" @click="pauseAgent(!paused)">
                        <template x-if="!paused"><span class="material-symbols-outlined">pause</span></template>
                        <template x-if="paused"><span class="material-symbols-outlined">play_arrow</span></template>
                        <span x-text="paused ? 'Resume Agent' : 'Pause Agent'"></span>
                    </button>
                    <button class="text-button" @click="loadKnowledge()"><span class="material-symbols-outlined">upload</span>Import knowledge</button>
                    <button class="text-button" id="work_dir_browser" @click="fileBrowserModalProxy.openModal()"><span class="material-symbols-outlined">folder</span>Files</button>
                    <button class="text-button" id="history_inspect" @click="globalThis.openHistoryModal()"><span class="material-symbols-outlined">history</span>History</button>
                    <button class="text-button" id="ctx_window" @click="globalThis.openCtxWindowModal()"><span class="material-symbols-outlined">data_object</span>Context</button>
                    <button class="text-button" id="nudges_window" @click="nudge()"><span class="material-symbols-outlined">lightbulb</span>Nudge</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals and other components from webuiold -->
    <div id="settingsModal" x-data="settingsModalProxy"><x-component path="components/settings/settings.html"></x-component></div>
    <div id="fileBrowserModal" x-data="fileBrowserModalProxy"><x-component path="components/file_browser/file_browser.html"></x-component></div>
    <div id="genericModal" x-data="genericModalProxy"><x-component path="components/modals/generic.html"></x-component></div>
    <div id="fullScreenInputModal" x-data="fullScreenInputModalProxy"><x-component path="components/modals/full_screen_input.html"></x-component></div>
    <x-component path="chat/attachments/dragDropOverlay.html"></x-component>
    
    <!-- All scripts from webuiold, loaded in order -->
    <script type="module" src="js/scheduler.js"></script>
    <script type="module" src="js/history.js"></script>
    <script type="module" src="index.js"></script>
    <script defer src="vendor/alpine/alpine.collapse.min.js"></script>
    <script type="module" src="js/initFw.js"></script>
    <script type="text/javascript" src="js/settings.js"></script>
    <script type="text/javascript" src="js/file_browser.js"></script>
    <script type="text/javascript" src="js/modal.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('js/sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>

</body>
</html>
